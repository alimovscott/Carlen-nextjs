<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Premium Carlen dealer showroom with verified automotive specialist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.48" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#070B12"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0" cy="0" r="1" gradientTransform="translate(180 120) rotate(42) scale(310 240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E92C28" stop-opacity="0.42"/>
      <stop offset="0.48" stop-color="#FF5A3C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF5A3C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(670 430) rotate(-28) scale(330 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1646C1" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#1646C1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassPanel" x1="126" y1="90" x2="650" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="375" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141B29"/>
      <stop offset="1" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="carBody" x1="210" y1="345" x2="638" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#384257"/>
      <stop offset="0.44" stop-color="#1D2636"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <linearGradient id="carWindow" x1="335" y1="298" x2="510" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B6E91"/>
      <stop offset="1" stop-color="#1E2A3D"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="210" y1="342" x2="638" y2="381" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E92C28" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#FF5A3C"/>
      <stop offset="1" stop-color="#E92C28" stop-opacity="0.2"/>

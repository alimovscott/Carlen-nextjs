      <stop offset="0.38" stop-color="#FF8C50" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF5A3C" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

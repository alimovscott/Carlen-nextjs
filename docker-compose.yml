services:
  carlen-next:
    container_name: carlen-next
    restart: always
    image: node:20.10.0
    ports:
      - 4000:3000
    environment:
      - PORT=3000

    volumes:
      - ./:/usr/src/carlen-next
    working_dir: /usr/src/carlen-next

    networks:
      - client-network

    # production
    command: bash -c "yarn  && yarn run build && yarn run start "

networks:
  client-network:
    driver: bridge
